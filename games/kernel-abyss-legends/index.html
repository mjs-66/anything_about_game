<!doctype html>
<html lang="th">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kernel Abyss Legends</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Pixelify+Sans:wght@500;700&family=Press+Start+2P&display=swap">
<style>
/* Layout: one 16:9 pixel stage (480x270 canvas) with DOM HUD and menus laid over it, all sized from --u (stage height / 270). */
:root{color-scheme:dark;--bg:#05060c;--ink:#e9f1ff;--mut:#8f9cc0;--ac:#35e0ff;--hot:#ff4d8d;--gold:#ffd24a;--pn:#0b1124;--ln:#33407f;--ok:#4ade80;--bad:#ff5a5a;
 --px:'Press Start 2P',ui-monospace,monospace;--tx:'Chakra Petch','Tahoma','Noto Sans Thai',system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;font-family:var(--tx);touch-action:none;overscroll-behavior:none}
#wrap{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(100vw,177.78vh);height:min(56.25vw,100vh);overflow:hidden;background:#000;--u:2px;--fs:max(11px,calc(var(--u)*5.6));font-size:calc(var(--u)*6)}
#cv{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;image-rendering:pixelated;display:block}
button{font-family:inherit}
img.ic{image-rendering:pixelated;display:block}
/* HUD */
#hud{position:absolute;inset:0;pointer-events:none}
#hud[hidden]{display:none}
#tl{position:absolute;left:calc(var(--u)*5);top:calc(var(--u)*5);display:flex;gap:calc(var(--u)*3);align-items:flex-start}
#por{width:calc(var(--u)*34);height:calc(var(--u)*28);image-rendering:pixelated;background:#0b1124;border:calc(var(--u)*1.5) solid #cfe6ff;box-shadow:0 0 0 calc(var(--u)*.8) #000}
#bars{display:flex;flex-direction:column;gap:calc(var(--u)*2)}
.bar{position:relative;height:calc(var(--u)*9);background:#1a0a10;border:calc(var(--u)*1.2) solid #000;box-shadow:0 0 0 calc(var(--u)*.8) #cfe6ff;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;width:100%;display:block;transition:width .12s linear}
.bar.hp{width:calc(var(--u)*118)}.bar.hp i{background:linear-gradient(#ff7a7a 0 40%,#e0243c 40%)}
.bar.en{width:calc(var(--u)*92);height:calc(var(--u)*6)}.bar.en i{background:linear-gradient(#8fefff 0 40%,#1d9bd6 40%)}
.bar.hp b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:calc(var(--u)*5) var(--px);color:#fff;text-shadow:1px 1px 0 #000,-1px 1px 0 #000,1px -1px 0 #000,-1px -1px 0 #000}
#rel{display:flex;flex-wrap:wrap;gap:calc(var(--u)*1.5);width:calc(var(--u)*130);margin-top:calc(var(--u)*1)}
#rel .rc{position:relative;width:calc(var(--u)*13);height:calc(var(--u)*13)}
#rel .rc img{width:100%;height:100%}
#rel .rc em{position:absolute;right:-1px;bottom:-2px;font:normal calc(var(--u)*4.4) var(--px);color:#fff;text-shadow:1px 1px 0 #000,-1px 1px 0 #000,1px -1px 0 #000}
#tr{position:absolute;right:calc(var(--u)*5);top:calc(var(--u)*5);text-align:right;display:flex;flex-direction:column;gap:calc(var(--u)*2.5);align-items:flex-end}
#zn{font:700 calc(var(--u)*6) var(--tx);color:#fff;text-shadow:0 calc(var(--u)*.8) 0 #000,0 0 calc(var(--u)*3) #000}
#zn small{display:block;font:calc(var(--u)*4) var(--px);color:var(--ac)}
#prog{display:flex;gap:calc(var(--u)*1.2);align-items:center}
#hud.boss #prog{display:none}
#prog span{width:calc(var(--u)*4.5);height:calc(var(--u)*4.5);background:#1b2347;border:calc(var(--u)*.8) solid #000;box-shadow:0 0 0 calc(var(--u)*.6) #50609e}
#prog span.b{width:calc(var(--u)*6.5);height:calc(var(--u)*6.5);background:#4a1226;box-shadow:0 0 0 calc(var(--u)*.6) #ff6b8a;margin:0 calc(var(--u)*1)}
#prog span.d{background:#35e0ff;box-shadow:0 0 0 calc(var(--u)*.6) #bff6ff}
#prog span.d.b{background:#ff4d8d}
#prog span.c{background:#fff;animation:bl .6s steps(2) infinite}
@keyframes bl{50%{opacity:.35}}
#cr{font:calc(var(--u)*5) var(--px);color:var(--gold);text-shadow:1px 1px 0 #000}
#bossbar{position:absolute;left:50%;top:calc(var(--u)*7);transform:translateX(-50%);width:calc(var(--u)*150);text-align:center}
#bossbar[hidden]{display:none}
#bnm{font:700 calc(var(--u)*6) var(--tx);text-shadow:0 calc(var(--u)*.8) 0 #000,0 0 calc(var(--u)*3) #000;margin-bottom:calc(var(--u)*2);letter-spacing:.08em}
#bossbar .bar{height:calc(var(--u)*8);width:100%}
#bf{background:linear-gradient(#ff9a9a 0 35%,#c91d3d 35%)}
#bf2{background:#fff;opacity:.5;transition:width .6s ease-out .25s}
/* skill slots + touch buttons */
#pz{position:absolute;right:calc(var(--u)*5);top:calc(var(--u)*43);width:calc(var(--u)*17);height:calc(var(--u)*13);background:rgba(11,17,36,.85);border:calc(var(--u)*1.2) solid #8fa4d8;color:#fff;font:calc(var(--u)*5) var(--px);padding:0;pointer-events:auto;cursor:pointer}
#sk{position:absolute;right:calc(var(--u)*6);bottom:calc(var(--u)*6);display:flex;gap:calc(var(--u)*3);align-items:flex-end;pointer-events:auto}
.slot{position:relative;width:calc(var(--u)*25);height:calc(var(--u)*25);padding:0;background:#0b1124;border:calc(var(--u)*1.5) solid #cfe6ff;box-shadow:0 0 0 calc(var(--u)*.8) #000;cursor:pointer;color:#fff;overflow:hidden}
.slot img{position:absolute;inset:calc(var(--u)*2);width:calc(100% - var(--u)*4);height:calc(100% - var(--u)*4)}
.slot u{position:absolute;left:0;right:0;bottom:0;height:0;background:rgba(0,0,0,.72);text-decoration:none}
.slot kbd{position:absolute;left:calc(var(--u)*1.5);top:calc(var(--u)*1);font:calc(var(--u)*4.6) var(--px);color:#fff;text-shadow:1px 1px 0 #000,-1px 1px 0 #000,1px -1px 0 #000,-1px -1px 0 #000}
.slot em{position:absolute;right:calc(var(--u)*1.5);bottom:calc(var(--u)*.5);font:normal calc(var(--u)*4.6) var(--px);color:var(--ac);text-shadow:1px 1px 0 #000}
.slot.off{filter:grayscale(.9) brightness(.65)}
.slot.rdy{border-color:#ffe27a}
.k-HL{order:1}.k-DS{order:2}.k-S1{order:3}.k-S2{order:4}.k-U{order:5}.k-A{order:6}
.slot.t{display:none}
body.touch .slot.t{display:block}
body.touch .k-S1{order:1}body.touch .k-S2{order:2}body.touch .k-HL{order:3}body.touch .k-DS{order:4}
body.touch #sk{display:grid;grid-template-columns:repeat(3,auto);gap:calc(var(--u)*3);bottom:calc(var(--u)*5);right:calc(var(--u)*5)}
body.touch .slot{width:max(calc(var(--u)*25),50px);height:max(calc(var(--u)*25),50px)}
body.touch .slot.big{width:max(calc(var(--u)*34),68px);height:max(calc(var(--u)*34),68px)}
body.touch .slot kbd{display:none}
#pad{position:absolute;left:calc(var(--u)*6);bottom:calc(var(--u)*6);display:none;gap:calc(var(--u)*6);pointer-events:auto}
body.touch #pad{display:flex}
#stk{position:relative;width:max(calc(var(--u)*60),112px);height:max(calc(var(--u)*60),112px);border-radius:50%;background:rgba(11,17,36,.55);border:calc(var(--u)*1.5) solid rgba(207,230,255,.6);touch-action:none}
#stk i{position:absolute;left:50%;top:50%;width:42%;height:42%;margin:-21% 0 0 -21%;border-radius:50%;background:rgba(207,230,255,.85);box-shadow:0 0 0 calc(var(--u)*1) #000}
#pad button{width:max(calc(var(--u)*34),64px);height:max(calc(var(--u)*34),64px);background:rgba(11,17,36,.8);border:calc(var(--u)*1.5) solid #cfe6ff;color:#fff;font:calc(var(--u)*11) var(--px);padding:0}
#pad button:active,.slot:active{background:#1d3a6e}
#tip{position:absolute;left:50%;bottom:calc(var(--u)*34);transform:translateX(-50%);background:rgba(5,8,20,.88);border:calc(var(--u)*1.2) solid var(--ac);padding:calc(var(--u)*3) calc(var(--u)*7);font:700 var(--fs) var(--tx);white-space:nowrap;text-align:center;max-width:94%}
#tip[hidden]{display:none}
#tip b{color:var(--gold)}
#toast{position:absolute;left:50%;top:26%;transform:translateX(-50%);text-align:center;font:700 calc(var(--u)*9) var(--tx);text-shadow:0 calc(var(--u)*1) 0 #000,0 0 calc(var(--u)*5) var(--ac);opacity:0;pointer-events:none;white-space:nowrap}
#toast.on{animation:tst 1.9s ease-out forwards}
#toast small{display:block;font-size:calc(var(--u)*5.5);color:var(--mut);letter-spacing:.06em}
@keyframes tst{0%{opacity:0;transform:translate(-50%,calc(var(--u)*6))}12%{opacity:1;transform:translate(-50%,0)}80%{opacity:1}100%{opacity:0}}
/* cinematic */
#cine{position:absolute;inset:0;pointer-events:none}
#cine[hidden]{display:none}
#cine .bar1,#cine .bar2{position:absolute;left:0;right:0;height:14%;background:#000;animation:bars .5s ease-out both}
#cine .bar1{top:0}#cine .bar2{bottom:0;animation-name:bars2}
@keyframes bars{from{transform:translateY(-100%)}}@keyframes bars2{from{transform:translateY(100%)}}
#cine .ct{position:absolute;left:0;right:0;bottom:19%;text-align:center;animation:cti .7s .35s both}
@keyframes cti{from{opacity:0;transform:translateY(calc(var(--u)*8)) scale(1.08)}}
#cine .ct small{display:block;font:calc(var(--u)*5) var(--px);letter-spacing:.2em;color:var(--hot)}
#cine .ct h2{margin:calc(var(--u)*2) 0;font:calc(var(--u)*14) var(--px);color:#fff;text-shadow:calc(var(--u)*1.5) calc(var(--u)*1.5) 0 var(--hot),calc(var(--u)*-1) 0 0 var(--ac)}
#cine .ct h3{margin:0;font:700 calc(var(--u)*8) var(--tx);color:var(--gold);letter-spacing:.04em}
#cine .ct p{margin:calc(var(--u)*3) 0 0;font:calc(var(--u)*5.2) var(--tx);color:#cdd8f5}
#cine .ct p b{color:var(--hot)}
/* screens */
#ov{position:absolute;inset:0;pointer-events:none}
.scr{pointer-events:auto;position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(3,5,14,.78);font:500 var(--fs) var(--tx);animation:fi .25s both}
.scr.clear{background:linear-gradient(90deg,rgba(3,5,14,.0) 30%,rgba(3,5,14,.7))}
@keyframes fi{from{opacity:0}}
.pn{background:var(--pn);border:calc(var(--u)*1.6) solid var(--ln);box-shadow:0 0 0 calc(var(--u)*.9) #000,inset 0 0 0 calc(var(--u)*.9) #151e45,0 calc(var(--u)*5) calc(var(--u)*18) rgba(0,0,0,.6);padding:calc(var(--u)*8) calc(var(--u)*10);max-width:94%;max-height:94%;overflow:auto}
.pn h3{margin:0 0 calc(var(--u)*3);font:700 calc(var(--fs)*1.45) var(--tx);color:#fff}
.pn h3 i{font-style:normal;font-size:.7em;color:var(--hot);margin-left:.5em;letter-spacing:.06em}
.pn small.k{display:block;font:calc(var(--u)*4) var(--px);color:var(--ac);letter-spacing:.12em;margin-bottom:calc(var(--u)*3);line-height:1.5}
.pn p{margin:calc(var(--u)*2.5) 0;line-height:1.55;color:#cdd8f5}
.pn p b{color:var(--gold)}
.btn{font:700 var(--fs) var(--tx);color:var(--ink);background:linear-gradient(#1f2b5c,#141c40);border:calc(var(--u)*1.1) solid #46589f;box-shadow:0 calc(var(--u)*1.4) 0 #04071a;padding:calc(var(--u)*3.4) calc(var(--u)*9);cursor:pointer;letter-spacing:.03em;text-align:center}
.btn:hover,.btn:focus-visible{outline:none;background:linear-gradient(#5ceaff,#1aa6c9);color:#00131a;border-color:#d4faff}
.btn:active{transform:translateY(calc(var(--u)*1))}
.btn.pri{background:linear-gradient(#ffe27a,#e0a21a);color:#2a1800;border-color:#fff3b8}
.btn.pri:hover,.btn.pri:focus-visible{background:linear-gradient(#fff3b8,#ffc93a)}
.btn[disabled]{opacity:.45;cursor:default;filter:grayscale(.6)}
.row{display:flex;gap:calc(var(--u)*4);justify-content:center;flex-wrap:wrap;margin-top:calc(var(--u)*5)}
/* title */
.title{justify-content:space-between;padding:0 calc(var(--u)*24)}
.logo small{display:block;font:calc(var(--u)*4.4) var(--px);letter-spacing:.3em;color:var(--ac);margin-bottom:calc(var(--u)*5)}
.logo h1{margin:0;font:calc(var(--u)*24) var(--px);line-height:1.12;color:#fff;text-shadow:calc(var(--u)*2) calc(var(--u)*2) 0 var(--hot),calc(var(--u)*-1.2) 0 0 var(--ac),0 calc(var(--u)*4) calc(var(--u)*12) #000;animation:gl 3.4s steps(1) infinite}
.logo h2{margin:calc(var(--u)*5) 0 0;font:calc(var(--u)*9) var(--px);color:var(--gold);letter-spacing:.35em;text-shadow:calc(var(--u)*1) calc(var(--u)*1) 0 #000}
@keyframes gl{0%,92%,100%{transform:none}93%{transform:translate(calc(var(--u)*-2),0) skewX(-6deg)}95%{transform:translate(calc(var(--u)*2),calc(var(--u)*1))}97%{transform:none}}
.menu{display:flex;flex-direction:column;gap:calc(var(--u)*4);min-width:calc(var(--u)*98)}
.menu em{font-style:normal;color:var(--gold);float:right}
.foot{position:absolute;left:0;right:0;bottom:calc(var(--u)*5);text-align:center;font:calc(var(--u)*4) var(--px);color:#6f7ca8}
/* select */
.sel{flex-direction:column;gap:calc(var(--u)*4);align-items:center}
.sel h3{margin:0;font:700 calc(var(--fs)*1.5) var(--tx);color:#fff;text-shadow:0 calc(var(--u)*1) 0 #000}
.cards{display:flex;gap:calc(var(--u)*6);align-items:stretch;justify-content:center}
.cc{width:calc(var(--u)*118);background:var(--pn);border:calc(var(--u)*1.6) solid var(--ln);box-shadow:0 0 0 calc(var(--u)*.9) #000;padding:calc(var(--u)*5);color:var(--ink);text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:calc(var(--u)*2.4)}
.cc:hover,.cc.on{border-color:var(--ac);background:#0f1a3a;box-shadow:0 0 0 calc(var(--u)*.9) #000,0 0 calc(var(--u)*10) rgba(53,224,255,.45)}
.cc canvas{width:calc(var(--u)*60);height:calc(var(--u)*58);align-self:center;image-rendering:pixelated;background:linear-gradient(#10183a,#1b0d2a);border:calc(var(--u)*1) solid #000}
.cc h4{margin:0;font:700 calc(var(--fs)*1.25) var(--tx)}.cc h4 span{font-size:.7em;color:var(--mut);margin-left:.4em}
.cc .ro{color:var(--gold);font-size:.92em}
.st{display:flex;align-items:center;gap:calc(var(--u)*2);font:calc(var(--u)*4) var(--px);color:var(--mut)}
.st b{width:calc(var(--u)*18);font-weight:400}
.st i{height:calc(var(--u)*3.4);background:linear-gradient(90deg,var(--ac),var(--ac));display:block}
.sk2{display:flex;gap:calc(var(--u)*3);align-items:center;line-height:1.25}
.sk2 img{width:calc(var(--u)*14);height:calc(var(--u)*14);flex:none}
.sk2 small{display:block;color:var(--mut);font-size:.82em}
/* upgrades */
.ups{width:calc(var(--u)*330)}
.ur{display:flex;gap:calc(var(--u)*4);align-items:center;padding:calc(var(--u)*3) 0;border-top:calc(var(--u)*.6) solid #1c2652}
.ur img{width:calc(var(--u)*18);height:calc(var(--u)*18)}
.ur div{flex:1;line-height:1.3}.ur div small{display:block;color:var(--mut)}
.pips{display:flex;gap:calc(var(--u)*1.2);margin-top:calc(var(--u)*1.5)}.pips s{width:calc(var(--u)*7);height:calc(var(--u)*3);background:#1b2347;display:block;text-decoration:none}.pips s.f{background:var(--ac)}
.cores{float:right;font:calc(var(--u)*6) var(--px);color:var(--gold)}
/* relic pick */
.pk{text-align:center}
.pk h3{font-size:calc(var(--fs)*1.6)}
.rcs{display:flex;gap:calc(var(--u)*6);justify-content:center;margin-top:calc(var(--u)*5)}
.rcard{position:relative;width:calc(var(--u)*100);background:#0b1124;border:calc(var(--u)*1.6) solid var(--tc,#9fb4d9);box-shadow:0 0 0 calc(var(--u)*.9) #000,0 0 calc(var(--u)*12) var(--tg,transparent);padding:calc(var(--u)*6) calc(var(--u)*5);color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*2.5);animation:up .35s both}
.rcard:nth-child(2){animation-delay:.07s}.rcard:nth-child(3){animation-delay:.14s}
@keyframes up{from{opacity:0;transform:translateY(calc(var(--u)*10))}}
.rcard:hover,.rcard:focus-visible{outline:none;transform:translateY(calc(var(--u)*-3));background:#14204a}
.rcard img{width:calc(var(--u)*36);height:calc(var(--u)*36)}
.rcard h4{margin:0;font:700 calc(var(--fs)*1.15) var(--tx);color:var(--tc)}
.rcard .tr{font:calc(var(--u)*3.8) var(--px);color:var(--tc);letter-spacing:.1em}
.rcard p{margin:0;color:#cdd8f5;line-height:1.4;font-size:.95em}
.rcard em{font-style:normal;color:var(--mut);font-size:.88em}
.rcard kbd{position:absolute;left:calc(var(--u)*3);top:calc(var(--u)*2);font:calc(var(--u)*4.5) var(--px);color:var(--mut)}
/* quiz */
.qz{width:calc(var(--u)*300)}
.qa{display:flex;flex-direction:column;gap:calc(var(--u)*3);margin-top:calc(var(--u)*4)}
.qa .btn{text-align:left;display:flex;gap:calc(var(--u)*4);align-items:flex-start;line-height:1.35}
.qa .btn b{color:var(--gold);font-family:var(--px);font-size:.8em;padding-top:.15em}
.qa .btn.ok{background:linear-gradient(#7af0a4,#1f9d57);color:#02150a;border-color:#caffdd}
.qa .btn.no{background:linear-gradient(#ff8a8a,#b52a3a);color:#1a0206;border-color:#ffd0d0}
.res{margin-top:calc(var(--u)*4);padding:calc(var(--u)*4);border:calc(var(--u)*1) solid var(--ln);background:#080d1d;line-height:1.5}
.res h4{margin:0 0 calc(var(--u)*2);font:700 calc(var(--fs)*1.3) var(--tx)}
.res.ok h4{color:var(--ok)}.res.no h4{color:var(--bad)}
/* result */
.end{width:calc(var(--u)*300);text-align:center}
.end h3{font:calc(var(--fs)*2.4) var(--px);margin-bottom:calc(var(--u)*5)}
.end.win h3{color:var(--gold);text-shadow:calc(var(--u)*1.2) calc(var(--u)*1.2) 0 var(--hot)}
.end.lose h3{color:var(--bad);text-shadow:calc(var(--u)*1.2) calc(var(--u)*1.2) 0 #000}
.sts{display:grid;grid-template-columns:1fr 1fr;gap:calc(var(--u)*2) calc(var(--u)*8);text-align:left;margin:calc(var(--u)*4) 0}
.sts span{color:var(--mut)}.sts b{float:right;color:#fff}
.how{width:calc(var(--u)*340)}
.how table{width:100%;border-collapse:collapse}.how td{padding:calc(var(--u)*1.6) calc(var(--u)*3);border-top:calc(var(--u)*.6) solid #1c2652;vertical-align:top}
.how td:first-child{white-space:nowrap;color:var(--ac);font:calc(var(--u)*4.2) var(--px);padding-top:calc(var(--u)*2.6)}
.how h5{margin:calc(var(--u)*4) 0 calc(var(--u)*1);font-size:1em;color:var(--gold)}
.story{width:calc(var(--u)*300);text-align:center}
.story p{font-size:calc(var(--fs)*1.12);line-height:1.8;min-height:calc(var(--u)*72)}
/* v2: locks, codex, tags, zone map */
.slot.lk{filter:none;border-color:#ff3a3a}
.slot.lk::after{content:'LOCK';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(70,0,12,.8);font:calc(var(--u)*4.2) var(--px);color:#ff9a9a}
.tag{display:inline-block;padding:calc(var(--u)*1) calc(var(--u)*3);border:calc(var(--u)*.8) solid currentColor;font:700 .82em var(--tx);letter-spacing:.02em;margin-right:calc(var(--u)*2)}
.tag.u{color:#ffd24a}.tag.s{color:#ff6b6b}.tag.h{color:#b9a6ff}.tag.p{color:#7dd3fc}
.zmap{display:flex;gap:calc(var(--u)*2);margin:calc(var(--u)*3) 0}
.zmap span{flex:1;height:calc(var(--u)*4);background:#1b2347;border:calc(var(--u)*.6) solid #000}
.zmap span.d{background:var(--ac)}.zmap span.c{background:var(--gold);animation:bl .6s steps(2) infinite}
.wk{margin-top:calc(var(--u)*3)!important;color:#bff6ff!important;font-weight:700}

const calcDmg=(mult,crit)=>Math.max(1,Math.round(ST.atk*mult*rnd(.92,1.08)*(crit?ST.cdm:1)));
function hitE(e,mult,o){o=o||{};const crit=o.crit||R()<ST.crit;dealE(e,calcDmg(mult,crit),crit,o)}
function dealE(e,d,crit,o){
 if(e.dead||e.hide)return;if(e.ghost){if(!o.burn&&!(e.imT>0)){e.imT=.5;num(e.x,e.y,e.alt+e.h+6,'IMMUNE','info')}return}

 e.hp-=d;e.fl=.09;const a=o.ang!=null?o.ang:Math.atan2(e.y-P.y,e.x-P.x);
 if(!e.arm&&!o.noKb){e.stun=Math.max(e.stun||0,.2+(o.big?.12:0));const k=(o.kb||80)*ST.kb/e.mass;e.vx=Math.cos(a)*k;e.vy=Math.sin(a)*k;if(e.s=='wind'||e.s=='leap'||e.s=='dive'||e.s=='hit'){e.s=e.fly?'hover':'run';if(!e.fly)e.alt=0}}

 else num(e.x,e.y,e.alt+e.h+4,d,'dot');
